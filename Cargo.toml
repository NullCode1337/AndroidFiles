[package]
name = "AndroidFiles"
version = "0.1.0"
edition = "2024"
description = "Desktop file manager for Android devices over adb"
repository = "https://github.com/NullCode1337/AndroidFiles"
license = "GPL-3.0-only"

[dependencies]
gpui-kit = "=0.9.0"
adb_client = "=2.1.19"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
smol = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
gpui-pre = { version = "=0.3.11", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.11", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[package.metadata.deb]
maintainer = "NullCode1337 <contact.nullcode@proton.me>"
copyright = "2026, NullCode1337"
license-file = "LICENSE"
extended-description = """
AndroidFiles is a desktop file manager for Android devices connected over adb.
It allows for browsing, transfers, renaming, deleting, and selective backups.
"""
depends = "$auto, adb, fastboot, libegl1, libfontconfig1, libfreetype6, libvulkan1, libwayland-client0, libx11-6, libxcb1, libxkbcommon0, libxkbcommon-x11-0"
assets = [
    ["target/release/AndroidFiles", "usr/bin/androidfiles", "755"],
    ["src/assets/androidfiles.desktop", "usr/share/applications/androidfiles.desktop", "644"],
    ["src/assets/logo.png", "usr/share/icons/hicolor/1024x1024/apps/androidfiles.png", "644"]
]
